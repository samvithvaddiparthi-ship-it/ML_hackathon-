<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14325c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>
  <!-- Laptop 2 -->
  <rect x="20" y="40" width="270" height="300" rx="12" fill="#eef5ff" stroke="#1f6fd1" stroke-width="2"/>
  <text x="155" y="68" text-anchor="middle" font-weight="700" font-size="15" fill="#14325c">Laptop 2 – Evaluator UI</text>
  <rect x="45" y="88" width="220" height="62" rx="8" fill="#fff" stroke="#9dbbe6"/>
  <text x="155" y="112" text-anchor="middle" font-weight="600">Browser: ui/index.html + app.js</text>
  <text x="155" y="132" text-anchor="middle" fill="#555">Leaflet bundled (ui/vendor)</text>
  <rect x="45" y="165" width="220" height="70" rx="8" fill="#fff" stroke="#9dbbe6"/>
  <text x="155" y="188" text-anchor="middle">trip list · Run button</text>
  <text x="155" y="207" text-anchor="middle">map: GPS (blue), route (red)</text>
  <text x="155" y="226" text-anchor="middle">metric cards · error banner</text>
  <rect x="45" y="250" width="220" height="40" rx="8" fill="#fff" stroke="#9dbbe6"/>
  <text x="155" y="275" text-anchor="middle" fill="#555">python -m http.server 5500</text>
  <text x="155" y="318" text-anchor="middle" fill="#8c1c1c" font-size="12">never receives reference arcs/geometry</text>

  <!-- Laptop 1 -->
  <rect x="560" y="40" width="320" height="300" rx="12" fill="#f3f7ef" stroke="#1a9e3f" stroke-width="2"/>
  <text x="720" y="68" text-anchor="middle" font-weight="700" font-size="15" fill="#14451f">Laptop 1 – Model + API</text>
  <rect x="585" y="88" width="270" height="52" rx="8" fill="#fff" stroke="#9fcfa9"/>
  <text x="720" y="110" text-anchor="middle" font-weight="600">FastAPI  api/main.py  :8000</text>
  <text x="720" y="128" text-anchor="middle" fill="#555">CORS · trip_id regex · console + file log</text>
  <rect x="585" y="152" width="130" height="78" rx="8" fill="#fff" stroke="#9fcfa9"/>
  <text x="650" y="175" text-anchor="middle" font-weight="600">predict_trip</text>
  <text x="650" y="194" text-anchor="middle" font-size="12">candidates →</text>
  <text x="650" y="210" text-anchor="middle" font-size="12">classifier → HMM</text>
  <text x="650" y="224" text-anchor="middle" font-size="11" fill="#555">no .route read</text>
  <rect x="725" y="152" width="130" height="78" rx="8" fill="#fff" stroke="#9fcfa9"/>
  <text x="790" y="175" text-anchor="middle" font-weight="600">score_trip</text>
  <text x="790" y="194" text-anchor="middle" font-size="12">reads .route</text>
  <text x="790" y="210" text-anchor="middle" font-size="12">server-side only</text>
  <text x="790" y="224" text-anchor="middle" font-size="11" fill="#555">returns numbers</text>
  <rect x="585" y="242" width="270" height="48" rx="8" fill="#fff" stroke="#9fcfa9"/>
  <text x="720" y="262" text-anchor="middle">artifacts/ (model) · PATHSNAP_EVAL_DATA</text>
  <text x="720" y="280" text-anchor="middle" fill="#555">10 trip folders: .track .nodes .arcs .route</text>
  <text x="720" y="318" text-anchor="middle" fill="#14451f" font-size="12">[PathSnap] log line per request (console)</text>

  <!-- arrows -->
  <line x1="292" y1="120" x2="556" y2="120" stroke="#14325c" stroke-width="2" marker-end="url(#a)"/>
  <text x="424" y="104" text-anchor="middle" font-weight="600">GET /trips · POST /predict {trip_id}</text>
  <line x1="556" y1="200" x2="292" y2="200" stroke="#14325c" stroke-width="2" marker-end="url(#a)"/>
  <text x="424" y="188" text-anchor="middle" font-weight="600">JSON: gps, route_coords, pred_arc,</text>
  <text x="424" y="222" text-anchor="middle">metrics (numbers only), latency, model</text>
  <text x="424" y="290" text-anchor="middle" fill="#555">same Wi-Fi / phone hotspot · TCP 8000</text>
</svg>
